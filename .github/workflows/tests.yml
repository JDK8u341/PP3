name: 自动测试

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 构建 PP3 原生扩展
        run: python -m pip install -e ".[jit,aot]"
      - name: 确认原生扩展可用
        env:
          PP3_REQUIRE_NATIVE: "1"
        run: python -B -m unittest tests.test_execution.ExecutionTests.test_native_extension_is_built_when_required -v
      - name: 运行回归测试
        env:
          PP3_TEST_AOT: "1"
          PP3_TEST_JIT: "1"
          PP3_REQUIRE_NATIVE: "1"
        run: python -B -m unittest discover -v
      - name: 验证纯 Python 回退
        env:
          PP3_DISABLE_NATIVE: "1"
        run: python -B -m unittest discover -v
